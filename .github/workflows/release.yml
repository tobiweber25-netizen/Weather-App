name: Build & Release OTA Update

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Wireless Update'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Populate local.properties from GitHub Secrets
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          if [ -n "${{ secrets.GOOGLE_WEATHER_API_KEY }}" ]; then
            echo "GOOGLE_WEATHER_API_KEY=${{ secrets.GOOGLE_WEATHER_API_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and Rename Release APK
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find app/build/outputs/apk/release -name "*release.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Signed release APK not found! Checking fallback..."
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          echo "Using APK at: $APK_PATH"
          cp "$APK_PATH" release-artifacts/weather-app-release.apk

      - name: Generate OTA Metadata
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
          RELEASE_TITLE: ${{ github.event.inputs.release_title || github.ref_name }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json, os, re, subprocess

          tag = os.environ["TAG_NAME"].strip()
          title = os.environ.get("RELEASE_TITLE", "").strip() or tag
          repo = os.environ.get("GITHUB_REPO", "tobiweber25-netizen/Weather-App").strip()

          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              gradle_text = f.read()

          vc_match = re.search(r"versionCode\s*=\s*(\d+)", gradle_text)
          vn_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_text)
          version_code = int(vc_match.group(1)) if vc_match else 0
          version_name = vn_match.group(1) if vn_match else tag.lstrip("vV")

          apk_file = "release-artifacts/weather-app-release.apk"
          apk_size = os.path.getsize(apk_file)

          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
                  stderr=subprocess.DEVNULL,
                  text=True,
              ).strip()
              log_range = f"{prev_tag}..HEAD"
          except subprocess.CalledProcessError:
              log_range = "-n 5"

          cmd = ["git", "log"] + (log_range.split() if log_range.startswith("-") else [log_range]) + ["--pretty=format:• %s"]
          try:
              notes = subprocess.check_output(cmd, text=True).strip()
          except subprocess.CalledProcessError:
              notes = ""
          if not notes:
              notes = f"Release {tag}"

          metadata = {
              "version_name": version_name,
              "version_code": version_code,
              "tag_name": tag,
              "release_title": title,
              "release_notes": notes,
              "apk_name": "weather-app-release.apk",
              "apk_size": apk_size,
              "download_url": f"https://github.com/{repo}/releases/download/{tag}/weather-app-release.apk",
          }

          with open("release-artifacts/ota-metadata.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2)

          print("Generated ota-metadata.json:")
          print(json.dumps(metadata, indent=2))
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          files: |
            release-artifacts/weather-app-release.apk
            release-artifacts/ota-metadata.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
